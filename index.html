<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMS — prototype</title>
  <meta name="description" content="Un logiciel de gestion hôtelière en ligne pour gérer les réservations, la réception, les chambres et les clés d'accès d'un hôtel.">
  <!--
    Prototype du framework : une page HTML autonome, données factices dans data.js, aucune base.
    Règles : sobre, peu de couleurs (un seul accent), clair/sombre, lisible sur mobile, aucun chiffre ni
    témoignage inventé présenté comme réel (les données sont marquées « exemple »).
    Structure : core.js (utilitaires, registre, navigation) + un fichier par module dans modules/.
    Les actions modifient l'état en mémoire : recharger la page revient aux données d'exemple.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* Charte de l'agent SAV (Max, TechRise) : encre #16180F, crème #F6F6F0, citron #C6F24E rare (repère actif, logo,
       focus), jamais sur un bouton ; une seule police (Inter) ; textes secondaires au-dessus de 4,5:1. */
    :root{--bg:#F6F6F0;--surface:#fff;--ink:#16180F;--ink2:#55574E;--line:#E5E5DC;--soft:#EFEFE7;--accent:#C6F24E;--accent-ink:#16180F;--ring:#8DB31F;
          --s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;--s6:#008a17;--shadow:0 1px 2px rgba(22,24,15,.05),0 4px 14px rgba(22,24,15,.04);
          --ok-bg:#E3F0E8;--ok-fg:#2E6B4E;--warn-bg:#FBF1D6;--warn-fg:#7A5400;--bad-bg:#FBE4E2;--bad-fg:#A3302A;--info-bg:#E4F0F7;--info-fg:#1E5E85;
          --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E0F0C;--surface:#16180F;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22;--soft:#1F2219;--s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--s6:#0aac23;--shadow:0 1px 2px rgba(0,0,0,.4);--ok-bg:#17291F;--ok-fg:#7BD3A4;--warn-bg:#2E2611;--warn-fg:#E8B54A;--bad-bg:#33191A;--bad-fg:#FF8A80;--info-bg:#142636;--info-fg:#7CC0E8}}
    :root[data-theme=dark]{--bg:#0E0F0C;--surface:#16180F;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22;--soft:#1F2219;--s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--s6:#0aac23;--shadow:0 1px 2px rgba(0,0,0,.4);--ok-bg:#17291F;--ok-fg:#7BD3A4;--warn-bg:#2E2611;--warn-fg:#E8B54A;--bad-bg:#33191A;--bad-fg:#FF8A80;--info-bg:#142636;--info-fg:#7CC0E8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
    .badge{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
    :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
    .chips button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
    .chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .split>div{min-width:0}
    /* Coque : menu latéral repliable + en-tête applicatif (comme l'agent SAV) */
    body.auth .shell,body:not(.auth) #login{display:none}
    .shell{display:grid;grid-template-columns:var(--sbw,260px) minmax(0,1fr);min-height:100vh}
    body.sb-collapsed{--sbw:70px}
    #sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);box-shadow:1px 0 10px rgba(0,0,0,.05);z-index:40;min-width:0}
    .sb-brand{display:flex;gap:10px;align-items:center;padding:16px 16px 10px;min-width:0}
    .sb-brand .lbl strong{display:block;font-size:16px;letter-spacing:-.01em}
    .logo{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:17px;position:relative}
    .logo::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:99px;background:var(--accent);border:2px solid var(--bg)}
    .logo.lg{width:56px;height:56px;border-radius:14px;font-size:28px;margin:0 auto 14px}
    #tabs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 10px 12px}
    .navtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:16px 10px 6px;white-space:nowrap}
    .navtools{display:flex;gap:4px;justify-content:flex-end;margin:4px 0 2px}
    #tabs .navtools button{display:inline-block;width:auto;font:inherit;font-size:11px;border:0;background:none;color:var(--ink2);padding:3px 6px;border-radius:6px;cursor:pointer}.navtools button:hover{background:var(--soft);color:var(--ink)}
    .navgroup{margin-top:2px}
    .navhead{display:flex!important;gap:8px;align-items:center;width:100%;font:inherit;font-size:11px!important;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)!important;background:none;border:0;border-radius:8px;padding:9px 10px!important;cursor:pointer;white-space:nowrap}
    .navhead:hover{background:var(--soft)!important;color:var(--ink)!important}.navhead.has{color:var(--ink)!important}
    .navhead span:first-child{flex:1;text-align:left}.navhead .cnt{font-size:11px;font-weight:500;letter-spacing:0;color:var(--ink2);background:var(--soft);border-radius:99px;padding:0 7px}
    .navhead svg{transition:transform .15s;transform:rotate(-90deg)}.navgroup.open .navhead svg{transform:none}
    .navgroup:not(.open) .navitems{display:none}.navitems{padding-bottom:6px}
    .navhead[aria-current]::before{display:none}
    #tabs button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14px;border:0;background:none;color:var(--ink2);border-radius:8px;padding:7px 10px;cursor:pointer;position:relative;white-space:nowrap}
    #tabs button:hover{background:var(--soft);color:var(--ink)}
    #tabs button[aria-current=true]{background:var(--soft);color:var(--ink);font-weight:600}
    #tabs button[aria-current=true]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
    #tabs svg{flex:none}
    .sb-foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
    #sbuser{display:flex;gap:10px;align-items:center;padding:6px;min-width:0}
    .sb-foot .collapse{display:flex;gap:10px;align-items:center;font:inherit;font-size:13px;border:0;background:none;color:var(--ink2);border-radius:8px;padding:6px 10px;cursor:pointer}
    .sb-foot .collapse:hover{background:var(--soft);color:var(--ink)}
    body.sb-collapsed .lbl,body.sb-collapsed .navtitle,body.sb-collapsed .navhead,body.sb-collapsed .navtools{display:none!important}
    body.sb-collapsed .navgroup .navitems{display:block}
    body.sb-collapsed .navgroup{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
    body.sb-collapsed #tabs button{justify-content:center;padding:8px 0}
    body.sb-collapsed .sb-brand,body.sb-collapsed #sbuser{justify-content:center;padding-left:0;padding-right:0}
    body.sb-collapsed .collapse svg{transform:rotate(180deg)}
    .main{min-width:0;display:flex;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:60px;padding:0 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .crumb{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb .sep{color:var(--line)}
    .spacer{flex:1}
    .datepill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
    .iconbtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:0;background:none;border-radius:9px;color:var(--ink2);cursor:pointer;position:relative}
    .iconbtn:hover{background:var(--soft);color:var(--ink)}
    .iconbtn .count{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
    .avatar{width:34px;height:34px;flex:none;border-radius:99px;border:0;background:var(--soft);color:var(--ink);font:inherit;font-weight:600;font-size:13px;display:grid;place-items:center;cursor:pointer}
    .avatar.sm{width:30px;height:30px;font-size:12px}
    .dd{position:relative}.dd .menu-pop{display:none}.dd.open .menu-pop{display:block}
    .menu-pop{position:absolute;right:0;top:46px;width:300px;max-width:88vw;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:50}
    .menu-pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14px;border:0;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
    .menu-pop button:hover{background:var(--soft)}.menu-pop button.danger{color:#B42318}
    .menu-pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}.pop-title{padding:8px 10px;font-size:14px}
    main#app{padding:0 28px;flex:1}
    #menu{display:none}.scrim{display:none}
    @media (max-width:1024px){
      .shell{grid-template-columns:minmax(0,1fr)}
      #sidebar{position:fixed;left:0;top:0;width:280px;max-width:85vw;transform:translateX(-100%);transition:transform .2s}
      body.menu-open #sidebar{transform:none}
      body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
      body.sb-collapsed .lbl,body.sb-collapsed .navtitle{display:revert}
      body.sb-collapsed .navhead,body.sb-collapsed .navtools{display:flex!important}body.sb-collapsed .navgroup:not(.open) .navitems{display:none}
      #menu{display:grid}.sb-foot .collapse{display:none}
      .topbar{padding:0 12px}main#app{padding:0 16px}}
    @media (max-width:600px){.topbar .badge,.datepill{display:none}}

    /* ---------- Composants enrichis (design des pages) ---------- */
    h1{font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;margin:26px 0 4px;font-weight:700}
    .card{box-shadow:var(--shadow);border-radius:14px}
    .card.clickable{cursor:pointer;transition:border-color .15s,transform .15s}.card.clickable:hover{border-color:var(--ink2);transform:translateY(-1px)}
    .stat{display:flex;flex-direction:column;gap:10px;min-height:132px}
    .stat-top{display:flex;gap:10px;align-items:center}.stat-ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none}
    .stat-label{font-size:13px;color:var(--ink2);font-weight:500}
    .stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
    .stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
    .stat-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}.stat-foot .pill{font-weight:600}
    .spark{flex:none;opacity:.9}
    .kpi{font-size:26px;letter-spacing:-.02em}
    .sec{padding:18px}.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sec-head h3{margin:0;font-size:15px;text-transform:none;letter-spacing:-.01em;color:var(--ink);font-weight:650}
    .chart svg{width:100%;height:auto;display:block;overflow:visible}
    .chart .gl{stroke:var(--line);stroke-width:1}.ax{font-size:11px;fill:var(--ink2);font-family:var(--font)}
    .chart .hit rect{fill:transparent}.chart .hit line{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3;opacity:0}.chart .hit:hover line{opacity:.6}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
    .donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut .dc{font-size:20px;font-weight:700;fill:var(--ink);font-family:var(--font)}
    .dlegend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:6px;font-size:13px}
    .dlegend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}.dlegend i{width:10px;height:10px;border-radius:3px}.dlegend .muted{font-size:12px;min-width:34px;text-align:right}
    .gauge .gv{font-size:15px;font-weight:700;fill:var(--ink);font-family:var(--font)}
    .track i{background:var(--s1)!important;border-radius:99px}.cols-chart .col i{background:var(--s1)!important;border-radius:4px 4px 0 0}
    table{box-shadow:var(--shadow);border-radius:14px}th{background:var(--soft);font-weight:600}tbody tr:hover td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
    .chips{background:var(--soft);padding:4px;border-radius:11px;display:inline-flex;gap:2px;margin-bottom:16px;max-width:100%}
    .chips button{border:0;background:none;color:var(--ink2);border-radius:8px;padding:6px 12px;font-weight:500}
    .chips button:hover{color:var(--ink)}.chips button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .btn{border-radius:9px;font-weight:500}.btn.danger{background:#B42318;border-color:#B42318;color:#fff}
    input,select,textarea{border-radius:9px;background:var(--surface)}
    .list button{box-shadow:var(--shadow)}
    .grid.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
    .dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.dash>*{grid-column:span 12}
    @media (min-width:1100px){.dash .w8{grid-column:span 8}.dash .w6{grid-column:span 6}.dash .w4{grid-column:span 4}}
    @media (min-width:760px) and (max-width:1099px){.dash .w6,.dash .w4{grid-column:span 6}}
    .feed{display:flex;flex-direction:column}.feed div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}.feed div:last-child{border:0}
    .feed .fi{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink2)}
    .quick{display:flex;gap:8px;flex-wrap:wrap}.quick .btn{display:inline-flex;gap:8px;align-items:center}
    /* Fenêtre de confirmation */
    #modal{position:fixed;inset:0;background:rgba(10,12,8,.45);display:none;place-items:center;z-index:100;padding:20px}
    #modal.open{display:grid}
    .modal-card{width:min(100%,440px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .14s ease-out}
    @keyframes pop{from{transform:scale(.96);opacity:0}}
    .modal-card h2{margin:12px 0 6px;font-size:18px}.modal-card p{margin:0 0 12px;color:var(--ink2);font-size:14px}
    .modal-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--info-bg);color:var(--info-fg)}.modal-ic.bad{background:var(--bad-bg);color:var(--bad-fg)}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
    /* Connexion */
    .login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,var(--soft),var(--bg) 70%)}
    .login-card{width:min(100%,440px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.08)}
    .login-title{text-align:center;font-size:24px;margin:0 0 4px}
    .btn.block{width:100%;height:44px;display:flex;gap:10px;align-items:center;justify-content:center}
    .divider{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:10px;padding:4px;gap:4px}
    .seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink2);border-radius:7px;padding:8px;cursor:pointer}
    .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
    .field-ic{position:relative}.field-ic>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
    .field-ic input{padding-left:38px;height:44px}.field-ic .peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink2);cursor:pointer;padding:6px}
    .okmsg{background:var(--soft);border-left:3px solid var(--ring);padding:8px 12px;border-radius:6px;font-size:14px}
    .demo{display:grid;gap:6px}.demo button{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
    .demo button:hover{border-color:var(--ink2)}
    .bars{display:flex;flex-direction:column;gap:6px}.barrow{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
    .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--ink)}
    .cols-chart{display:flex;gap:6px;align-items:flex-end;height:180px;padding-top:18px}
    .cols-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
    .cols-chart .col i{display:block;width:100%;max-width:38px;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
    .cols-chart .col .num{font-size:11px;color:var(--ink2)}.cols-chart .col .muted{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .card.ai{border-style:dashed;border-color:var(--ink2)}
    .phone{width:300px;max-width:100%;border:10px solid var(--ink);border-radius:34px;background:var(--bg);overflow:hidden}
    .phone-bar{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:2px 0 8px}
    .phone-body{padding:14px;height:540px;overflow-y:auto;font-size:14px}
    .stack>*+*{margin-top:14px}
    h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin:24px 0 6px}.lead{color:var(--ink2);max-width:65ch;margin:0 0 20px}
    h2{font-size:17px;margin:28px 0 10px;letter-spacing:-.01em}h3{font-size:14px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
    .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 20px}
    .split{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start}
    @media (max-width:760px){.split{grid-template-columns:1fr}}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
    .kpi{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.muted{color:var(--ink2);font-size:13px}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}tr:last-child td{border-bottom:0}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700}
    .pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--line);white-space:nowrap}
    /* Pastilles d'état de la charte SAV : fond pastel + texte foncé de la même teinte. Le citron n'est pas utilisé ici. */
    .pill.on,.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.dark,.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
    .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.info{background:var(--info-bg);color:var(--info-fg)}
    .pill.outline{background:transparent;border:1px solid var(--ink2)}
    .tablewrap{overflow-x:auto}footer{margin:40px 28px 24px;color:var(--ink2);font-size:12px}
    .btn{font:inherit;border:1px solid var(--ink);border-radius:8px;padding:8px 14px;background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
    .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.sm{padding:4px 10px;font-size:13px}
    .btn.accent{font-weight:600} /* bouton principal mis en avant : reste en encre (charte SAV : jamais de citron sur un bouton) */
    .btn:disabled{opacity:.4;cursor:not-allowed}
    @media (max-width:600px){.btn{white-space:normal}}
    .link{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
    label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
    input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
    input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ink)}
    .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
    .form .full{grid-column:1/-1}
    .err{color:var(--ink);background:var(--line);border-left:3px solid var(--ink);padding:8px 12px;border-radius:6px;font-size:14px}
    .list{display:flex;flex-direction:column;gap:8px}
    .list button{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
    .list button[aria-current=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
    .step{display:flex;gap:12px;margin-top:18px}.step b.n{flex:none;width:26px;height:26px;border-radius:99px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
    .step>div{flex:1}
    .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .rooms label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);margin:0;cursor:pointer}
    .rooms label.dis{opacity:.45;cursor:not-allowed}
    .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
    .bar i{display:block;height:100%;width:0;background:var(--accent);animation:fill 1.4s linear forwards}
    @keyframes fill{to{width:100%}}
    .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
    .tags{display:flex;gap:6px;flex-wrap:wrap}.tags .pill button{background:none;border:0;padding:0 0 0 4px;cursor:pointer;color:inherit;font:inherit}
    .cell0{font-weight:700}
    .roomno{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
    #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
    #toast.show{opacity:1}
    .invoice{max-width:720px}
    @media print{#sidebar,.topbar,footer,.noprint{display:none!important}.shell{display:block}main#app{padding:0}body{background:#fff;color:#000}.card{border:0;padding:0}}
  </style>
