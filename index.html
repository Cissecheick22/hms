<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMS — prototype</title>
  <meta name="description" content="Un logiciel de gestion hôtelière en ligne pour gérer les réservations, la réception, les chambres et les clés d'accès d'un hôtel.">
  <!--
    Prototype du framework : une page HTML autonome, données factices dans data.js, aucune base.
    Règles : sobre, peu de couleurs (un seul accent), clair/sombre, lisible sur mobile, aucun chiffre ni
    témoignage inventé présenté comme réel (les données sont marquées « exemple »).
  -->
  <style>
    :root{--bg:#F6F5EE;--surface:#fff;--ink:#0B0C0A;--ink2:#4B4E43;--line:#DFDED2;--accent:#C6F24E;--accent-ink:#0B0C0A;
          --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E0F0C;--surface:#171913;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22}}
    :root[data-theme=dark]{--bg:#0E0F0C;--surface:#171913;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
    .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line)}
    .brand{font-weight:700;font-size:18px;letter-spacing:-.01em}.badge{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
    nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}nav button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
    nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.02em;margin:24px 0 6px}.lead{color:var(--ink2);max-width:65ch;margin:0 0 20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
    .kpi{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.muted{color:var(--ink2);font-size:13px}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
    .pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--line)}.pill.on{background:var(--accent);color:var(--accent-ink)}
    .tablewrap{overflow-x:auto}footer{margin:40px 0;color:var(--ink2);font-size:12px}
    .btn{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--ink);color:var(--bg);cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="brand">HMS</span>
      <span style="display:flex;gap:8px;align-items:center">
        <span class="badge">Prototype · données d'exemple</span>
        <button class="btn" id="theme" aria-label="Thème">◐</button>
      </span>
    </header>
    <nav id="tabs" aria-label="Écrans"></nav>
    <main id="app"></main>
    <footer>Prototype non fonctionnel : aucune donnée réelle n'est enregistrée.</footer>
  </div>
  <script src="data.js"></script>
  <script>
    const $ = (s) => document.querySelector(s)
    $("#theme").onclick = () => {
      const r = document.documentElement
      r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"
    }
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])

    // Rendus disponibles par type d'écran (data.js → screens[].type)
    const views = {
      dashboard: (s) => `<h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead || "")}</p>
        <div class="grid">${s.kpis.map((k) => `<div class="card"><div class="muted">${esc(k.label)}</div><div class="kpi">${esc(k.value)}</div><div class="muted">${esc(k.hint || "")}</div></div>`).join("")}</div>`,
      table: (s) => `<h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead || "")}</p><div class="tablewrap"><table>
        <thead><tr>${s.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${s.rows.map((r) => `<tr>${r.map((v, i) => `<td>${i === r.length - 1 && s.status ? `<span class="pill ${v === s.status ? "on" : ""}">${esc(v)}</span>` : esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
      cards: (s) => `<h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead || "")}</p>
        <div class="grid">${s.items.map((it) => `<div class="card"><strong>${esc(it.title)}</strong><p class="muted">${esc(it.text)}</p></div>`).join("")}</div>`,
    }

    // Données chargées par data.js (balise script) plutôt que fetch : la page marche aussi ouverte directement (file://)
    ;((data) => {
      const tabs = $("#tabs")
      const show = (i) => {
        $("#app").innerHTML = views[data.screens[i].type](data.screens[i])
        tabs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)))
        history.replaceState(null, "", `#${data.screens[i].id}`)
      }
      data.screens.forEach((s, i) => {
        const b = document.createElement("button")
        b.textContent = s.label
        b.onclick = () => show(i)
        tabs.appendChild(b)
      })
      const start = data.screens.findIndex((s) => `#${s.id}` === location.hash)
      show(start >= 0 ? start : 0)
    })(window.PROTOTYPE_DATA)
  </script>
</body>
</html>
