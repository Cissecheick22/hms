<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMS — prototype</title>
  <meta name="description" content="Un logiciel de gestion hôtelière en ligne pour gérer les réservations, la réception, les chambres et les clés d'accès d'un hôtel.">
  <!--
    Prototype du framework : une page HTML autonome, données factices dans data.js, aucune base.
    Règles : sobre, peu de couleurs (un seul accent), clair/sombre, lisible sur mobile, aucun chiffre ni
    témoignage inventé présenté comme réel (les données sont marquées « exemple »).
    Structure : core.js (utilitaires, registre, navigation) + un fichier par module dans modules/.
    Les actions modifient l'état en mémoire : recharger la page revient aux données d'exemple.
  -->
  <style>
    :root{--bg:#F6F5EE;--surface:#fff;--ink:#0B0C0A;--ink2:#4B4E43;--line:#DFDED2;--accent:#C6F24E;--accent-ink:#0B0C0A;
          --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E0F0C;--surface:#171913;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22}}
    :root[data-theme=dark]{--bg:#0E0F0C;--surface:#171913;--ink:#F1F2E9;--ink2:#B6B9AA;--line:#2A2E22}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
    .wrap{max-width:1400px;margin:0 auto;padding:0 20px}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line)}
    .brand{font-weight:700;font-size:18px;letter-spacing:-.01em}.badge{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
    .chips button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
    .chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
    #tabs{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:16px 0 30px}
    .navgroup{margin-bottom:14px}.navtitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 4px 10px}
    #tabs button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:0;background:none;color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}
    #tabs button:hover{background:var(--surface)}#tabs button[aria-current=true]{background:var(--ink);color:var(--bg)}
    #menu{display:none}
    @media (max-width:900px){.layout{grid-template-columns:1fr}#menu{display:inline-block}#tabs{display:none;position:static;max-height:none}
      body.menu-open #tabs{display:block}body.menu-open main,body.menu-open footer{display:none}#ctx{display:none}}
    .bars{display:flex;flex-direction:column;gap:6px}.barrow{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
    .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--ink)}
    .cols-chart{display:flex;gap:6px;align-items:flex-end;height:180px;padding-top:18px}
    .cols-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
    .cols-chart .col i{display:block;width:100%;max-width:38px;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
    .cols-chart .col .num{font-size:11px;color:var(--ink2)}.cols-chart .col .muted{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .card.ai{border-style:dashed;border-color:var(--ink2)}
    .phone{width:300px;max-width:100%;border:10px solid var(--ink);border-radius:34px;background:var(--bg);overflow:hidden}
    .phone-bar{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:2px 0 8px}
    .phone-body{padding:14px;height:540px;overflow-y:auto;font-size:14px}
    .stack>*+*{margin-top:14px}
    h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin:24px 0 6px}.lead{color:var(--ink2);max-width:65ch;margin:0 0 20px}
    h2{font-size:17px;margin:28px 0 10px;letter-spacing:-.01em}h3{font-size:14px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
    .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 20px}
    .split{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start}
    @media (max-width:760px){.split{grid-template-columns:1fr}}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
    .kpi{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.muted{color:var(--ink2);font-size:13px}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}tr:last-child td{border-bottom:0}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700}
    .pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--line);white-space:nowrap}
    .pill.on{background:var(--accent);color:var(--accent-ink)}.pill.dark{background:var(--ink);color:var(--bg)}
    .pill.outline{background:transparent;border:1px solid var(--ink2)}
    .tablewrap{overflow-x:auto}footer{margin:40px 0;color:var(--ink2);font-size:12px}
    .btn{font:inherit;border:1px solid var(--ink);border-radius:8px;padding:8px 14px;background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
    .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.sm{padding:4px 10px;font-size:13px}
    .btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .link{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
    label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
    input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
    input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ink)}
    .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
    .form .full{grid-column:1/-1}
    .err{color:var(--ink);background:var(--line);border-left:3px solid var(--ink);padding:8px 12px;border-radius:6px;font-size:14px}
    .list{display:flex;flex-direction:column;gap:8px}
    .list button{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
    .list button[aria-current=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
    .step{display:flex;gap:12px;margin-top:18px}.step b.n{flex:none;width:26px;height:26px;border-radius:99px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
    .step>div{flex:1}
    .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .rooms label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);margin:0;cursor:pointer}
    .rooms label.dis{opacity:.45;cursor:not-allowed}
    .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
    .bar i{display:block;height:100%;width:0;background:var(--accent);animation:fill 1.4s linear forwards}
    @keyframes fill{to{width:100%}}
    .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
    .tags{display:flex;gap:6px;flex-wrap:wrap}.tags .pill button{background:none;border:0;padding:0 0 0 4px;cursor:pointer;color:inherit;font:inherit}
    .cell0{font-weight:700}
    .roomno{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
    #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
    #toast.show{opacity:1}
    .invoice{max-width:720px}
    @media print{header,nav,footer,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="row" style="gap:12px">
        <button class="btn ghost sm" id="menu" aria-label="Menu">Menu</button>
        <span class="brand">HMS</span>
        <span class="muted" id="ctx">Hôtel Exemple · date hôtelière : 26/11/2026</span>
      </span>
      <span style="display:flex;gap:8px;align-items:center">
        <span class="badge">Prototype · données d'exemple</span>
        <button class="btn" id="theme" aria-label="Thème">◐</button>
      </span>
    </header>
    <div class="layout">
      <nav id="tabs" aria-label="Modules"></nav>
      <div>
        <main id="app"></main>
        <footer>Prototype non fonctionnel : aucune donnée réelle n'est enregistrée. Les actions sont simulées en mémoire et disparaissent au rechargement.</footer>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="core.js"></script>
  <!-- Modules : un fichier par module de la spec (voir docs/MAQUETTE.md) -->
  <script src="modules/reception.js"></script>
  <script>startApp()</script>
</body>
</html>
